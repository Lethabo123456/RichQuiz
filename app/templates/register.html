<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Register</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet" />
  <style>
    body, html {
      height: 100%;
      margin: 0;
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.6)),
        url('https://images.unsplash.com/photo-1506744038136-46273834b3fb?auto=format&fit=crop&w=1350&q=80') no-repeat center center fixed;
      background-size: cover;
      display: flex;
      justify-content: center;
      align-items: center;
      color: #fff;
    }

    .register-container {
      background: rgba(0, 0, 0, 0.65);
      padding: 40px 50px;
      border-radius: 15px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.7);
      width: 100%;
      max-width: 400px;
      box-sizing: border-box;
      text-align: center;
    }

    h2 {
      margin-bottom: 30px;
      font-weight: 600;
      font-size: 2rem;
    }

    form {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    input, select {
      padding: 12px 15px;
      border-radius: 8px;
      border: none;
      outline: none;
      font-size: 1rem;
    }

    input:focus, select:focus {
      background-color: #fff;
      color: #333;
      box-shadow: 0 0 8px #4e73df;
    }

    button {
      padding: 14px 0;
      border: none;
      border-radius: 30px;
      background: #4e73df;
      color: white;
      font-weight: 600;
      font-size: 1.1rem;
      cursor: pointer;
      box-shadow: 0 6px 15px rgba(78, 115, 223, 0.7);
      transition: background-color 0.3s ease, transform 0.2s ease;
    }

    button:hover {
      background-color: #2e4ecc;
      transform: scale(1.05);
    }

    .flash-messages {
      padding: 10px;
      border-radius: 8px;
      margin-bottom: 20px;
      font-weight: 600;
    }

    .flash-success {
      background-color: rgba(76, 175, 80, 0.2);
      color: #81c784;
    }

    .flash-danger, .flash-warning {
      background-color: rgba(255, 107, 107, 0.2);
      color: #ff6b6b;
    }

    a {
      color: #ddd;
      font-weight: 600;
      text-decoration: none;
      display: block;
      margin-top: 20px;
    }

    a:hover {
      color: #fff;
      text-decoration: underline;
    }

    @media (max-width: 480px) {
      .register-container {
        padding: 30px 25px;
      }
    }
  </style>
</head>
<body>
  <div class="register-container">
    <h2>Create Account</h2>

    <!-- Flask Flash Messages -->
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for category, message in messages %}
          <div class="flash-messages flash-{{ category }}">{{ message }}</div>
        {% endfor %}
      {% endif %}
    {% endwith %}

    <!-- Working Form -->
    <form method="POST" action="{{ url_for('auth.register') }}">
      <input type="text" name="name" placeholder="Full Name" required />
      <input type="text" name="student_number" placeholder="Student Number" required />
      <input type="password" name="password" placeholder="Password" required />
      <select name="year_level" required>
        <option value="" disabled selected>Select Year Level</option>
        <option value="1">1st Year</option>
        <option value="2">2nd Year</option>
        <option value="3">3rd Year</option>
      </select>
      <button type="submit">Create Account</button>
    </form>

    <a href="{{ url_for('auth.login') }}">Already have an account? Login</a>
  </div>
</body>
</html>
