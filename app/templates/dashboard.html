<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Dashboard - {{ name }}</title>
  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: url('https://images.unsplash.com/photo-1504384308090-c894fdcc538d?auto=format&fit=crop&w=1350&q=80') no-repeat center center fixed;
      background-size: cover;
      color: #fff;
      height: 100vh;
      position: relative;
    }
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.65);
      z-index: 0;
    }
    .container {
      position: relative;
      z-index: 1;
      max-width: 650px;
      margin: 70px auto;
      background: rgba(255, 255, 255, 0.08);
      padding: 40px 50px;
      border-radius: 14px;
      box-shadow: 0 10px 40px rgba(31, 38, 135, 0.5);
      backdrop-filter: blur(15px);
      text-align: center;
    }
    h2 {
      margin-bottom: 24px;
      font-weight: bold;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.9);
    }
    p {
      margin-bottom: 28px;
      font-size: 1.1em;
      color: #ddd;
    }
    ul {
      list-style: none;
      padding: 0;
      margin: 0 0 30px 0;
    }
    ul li {
      margin: 16px 0;
    }
    ul li a {
      display: inline-block;
      padding: 14px 28px;
      background: #6c63ff;
      color: #fff;
      font-weight: 600;
      border-radius: 10px;
      text-decoration: none;
      box-shadow: 0 5px 15px rgba(108, 99, 255, 0.45);
      transition: background-color 0.3s ease, transform 0.2s;
      min-width: 220px;
    }
    ul li a:hover {
      background-color: #534dca;
      transform: scale(1.03);
    }
    .logout-btn {
      display: inline-block;
      margin-top: 25px;
      padding: 10px 25px;
      background: #e74c3c;
      color: #fff;
      text-decoration: none;
      font-weight: bold;
      border-radius: 8px;
      transition: background-color 0.3s ease;
    }
    .logout-btn:hover {
      background-color: #c0392b;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>Welcome {{ name }} ({{ student_number }})</h2>
    <p>Modules for Year {{ year_level }}</p>

    <ul>
      {% for module in modules %}
        <!-- Updated url_for endpoint to 'quiz.start_quiz' -->
        <li><a href="{{ url_for('quiz.start_quiz', module_id=module.id) }}">{{ module.name }}</a></li>
      {% endfor %}
    </ul>

    <a class="logout-btn" href="{{ url_for('auth.logout') }}">Logout</a>
  </div>
</body>
</html>
